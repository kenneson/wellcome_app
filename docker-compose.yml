version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_BASE_URL=${ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN}
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      - PAYMENT_CHECKOUT_EXPIRATION_MINUTES=${PAYMENT_CHECKOUT_EXPIRATION_MINUTES:-60}
      - PAYMENT_PROCESSING_FEE_PAYER=${PAYMENT_PROCESSING_FEE_PAYER:-PLATFORM}
      - APP_FEE_PERCENTAGE=${APP_FEE_PERCENTAGE:-10}
      - PORT=3000
    networks:
      - wellcome-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL:-http://localhost:3000}
        - EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}
        - EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wellcome-network

networks:
  wellcome-network:
    driver: bridge
