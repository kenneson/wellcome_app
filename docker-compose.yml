version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./homologacao-560634-wellcomeapp.p12:/app/certs/homologacao-560634-wellcomeapp.p12:ro
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - EFI_CLIENT_ID=${EFI_CLIENT_ID}
      - EFI_CLIENT_SECRET=${EFI_CLIENT_SECRET}
      - EFI_PIX_KEY=${EFI_PIX_KEY}
      - EFI_SANDBOX=${EFI_SANDBOX:-true}
      - EFI_CERT_PATH=/app/certs/homologacao-560634-wellcomeapp.p12
      - PORT=3000
    networks:
      - wellcome-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL:-http://localhost:3000}
        - EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}
        - EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wellcome-network

networks:
  wellcome-network:
    driver: bridge
